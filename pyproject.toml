[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamedubber"
version = "0.1.0"
description = "Resumable low-VRAM local game dubbing pipeline"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
gamedubber = "voice_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["voice_pipeline*"]
